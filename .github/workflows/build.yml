name: Build and test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version to embed in the published application
        required: false
        type: string
        default: '1.0.0'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-24.04
            rid: linux-x64
          - os: macos-15
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Runspace.slnx --locked-mode --property:Configuration=Release
      - name: Build
        run: dotnet build Runspace.slnx --configuration Release --no-restore
      - name: Install Linux software-rendering prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libfontconfig1 fonts-dejavu-core
      - name: Test
        env:
          RUNSPACE_UI_CAPTURE_DIR: ${{ runner.temp }}/runspace-ui
        run: dotnet test Runspace.slnx --configuration Release --no-build --logger "trx;LogFileName=results.trx"
      - name: Publish console
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version || '1.0.0' }}
        run: dotnet publish src/Runspace.Desktop/Runspace.Desktop.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --no-restore "-p:Version=$env:PACKAGE_VERSION" -p:ContinuousIntegrationBuild=true --output artifacts/publish
      - name: Upload console
        uses: actions/upload-artifact@v4
        with:
          name: runspace-${{ matrix.rid }}
          path: artifacts/publish
          if-no-files-found: error
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.rid }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
      - name: Upload fixture UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-ui-${{ matrix.rid }}
          path: ${{ runner.temp }}/runspace-ui
          if-no-files-found: error

  validate-publish:
    name: Published payload / ${{ matrix.rid }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-24.04
            rid: linux-x64
          - os: macos-15
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          name: runspace-${{ matrix.rid }}
          path: ${{ runner.temp }}/runspace-payload
      - name: Validate isolated Windows/macOS payload
        if: runner.os != 'Linux'
        shell: pwsh
        run: ./scripts/Validate-Publish.ps1 -Payload "${{ runner.temp }}/runspace-payload" -Results "${{ runner.temp }}/publish-results"
      - name: Validate clean Ubuntu payload with X11
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/publish-results"
          docker build --quiet --tag runspace-publish-validation --file scripts/publish-validation.Dockerfile scripts
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=${{ runner.temp }}/runspace-payload,target=/payload,readonly" \
            --mount "type=bind,source=${{ runner.temp }}/publish-results,target=/results" \
            runspace-publish-validation
      - name: Upload published validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-validation-${{ matrix.rid }}
          path: ${{ runner.temp }}/publish-results
          if-no-files-found: error
